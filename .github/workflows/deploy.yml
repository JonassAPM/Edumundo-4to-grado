name: Publicar EduAventura en GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 1. Descargar el código (HTML, CSS, JS y JSON tal cual, sin compilar)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. Subir la carpeta del proyecto tal cual
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 4. Publicar
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
