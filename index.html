<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Para que la pantalla se ajuste bien en teléfonos acostados -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Datos de la app para el navegador -->
    <meta name="description" content="EduAventura: aplicación educativa offline de matemáticas para 4.° de Básica Primaria." />
    <meta name="theme-color" content="#00BCD4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EduAventura" />

    <!-- Para que no guarde caché y siempre cargue lo último -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Archivo manifest para instalar como app -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Iconos de la pestaña -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./assets/images/icon-192.png" />

    <!-- Título de la pestaña -->
    <title>EduAventura – Matemáticas 4.° Grado Primaria</title>

    <!-- Estilos generales -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>

    <!-- Aviso para girar el celular si está en vertical -->
    <div id="rotate-screen" aria-live="polite" role="alert">
      <div class="rotate-screen__card">
        <div class="rotate-ribbon">⭐ EDUAVENTURA 4.° ⭐</div>
        
        <div class="phone-rotate-stage">
          <div class="cartoon-phone">
            <div class="cartoon-phone-earpiece"></div>
            <div class="cartoon-phone-screen">
              <!-- Vista cuando el teléfono está de pie -->
              <div class="screen-portrait-layer">
                <span class="sp-icon">🧒</span>
                <span class="sp-hint">¡GÍRAME!</span>
              </div>
              <!-- Vista cuando el teléfono está acostado -->
              <div class="screen-landscape-layer">
                <span class="sl-item">🏝️</span>
                <div class="sl-math">2 × 4 = 8</div>
                <span class="sl-item">⭐</span>
              </div>
            </div>
            <div class="cartoon-phone-button"></div>
          </div>
        </div>

        <h2 class="rotate-screen__title">¡Gira tu teléfono!</h2>
        <p class="rotate-screen__msg">
          Coloca tu pantalla en <strong>posición horizontal</strong> para comenzar a jugar.
        </p>
        <div class="rotate-screen__badge">
          <span class="rotate-badge-icon">🔄</span>
          <span>Modo Horizontal Obligatorio</span>
        </div>
        <div class="rotate-mascot-speech">
          <span class="rotate-mascot-avatar">🎒</span>
          <span>¡Acomoda tu pantalla para disfrutar del tablero completo!</span>
        </div>
      </div>
    </div>

    <!-- Contenedor donde se dibuja todo el juego -->
    <div id="app-container" role="main">
      <!-- Pantalla de carga mientras inicia el juego -->
      <div id="screen-splash" class="screen screen--active" aria-label="Cargando EduAventura">
        <div class="splash__logo" aria-hidden="true">
          <span class="splash__title">EduAventura</span>
          <span class="splash__subtitle">Matemáticas 4.° Grado</span>
          <span class="splash__institution">Educación Básica Primaria · 4.° Grado</span>
        </div>
        <div class="splash__spinner" aria-label="Cargando…"></div>
      </div>

      <!-- El resto de pantallas las dibuja el controlador (js/controllers/app_controller.js) -->
    </div>

    <!-- Archivo principal de JavaScript (arranca el patrón MVC) -->
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
